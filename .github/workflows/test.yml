name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -timeout 60s -race ./...
      - run: GOARCH=386 go test -timeout 60s ./...
      - run: go vet ./...
      - run: go test -run '^$' -fuzz '^FuzzConfigNumericConversions$' -fuzztime=10s -parallel=2
      - run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/config-windows.test.exe .
